    <rect x="184" y="80" width="164" height="72" rx="16"/>
    <rect x="348" y="152" width="76" height="84" rx="16"/>
    <rect x="184" y="236" width="164" height="72" rx="16"/>
    <rect x="272" y="328" width="76" height="104" rx="16"/>
    <rect x="364" y="360" width="60" height="72" rx="16"/>
